[package]
name = "par-fractal"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
authors = ["Paul Robello <probello@gmail.com>"]
description = "Cross-platform GPU-accelerated fractal renderer with 2D and 3D support"
readme = "README.md"
license = "MIT"
repository = "https://github.com/paulrobello/par-fractal"
homepage = "https://github.com/paulrobello/par-fractal"
documentation = "https://github.com/paulrobello/par-fractal/blob/main/README.md"
keywords = ["fractal", "gpu", "graphics", "visualization", "renderer"]
categories = ["graphics", "multimedia", "visualization"]
default-run = "par-fractal"
exclude = [
    "*.png",
    "*.jpg",
    "*.mp4",
    "*.webm",
    "*.gif",
    "screenshots/",
    "images/",
    ".github/",
    ".gitignore",
    "CLAUDE.md",
    "lod.md",
    "handoff.md",
    "plan.md",
    "dist/",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
native = [
    "dep:pollster",
    "dep:directories",
    "dep:rfd",
    "dep:open",
    "dep:crossbeam-channel",
    "dep:chrono",
    "dep:env_logger",
]
web = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
    "dep:console_log",
    "dep:console_error_panic_hook",
    "dep:gloo-timers",
    "dep:getrandom",
]

[[bin]]
name = "par-fractal"
path = "src/main.rs"
required-features = ["native"]

# ENH-007: PNG comparison + harness helpers for the visual-regression layer.
# Native-only: `gen-preset` calls `PresetGallery::save_preset` (filesystem), so
# it must not build under the `web` feature set.
[[bin]]
name = "imgdiff"
path = "src/bin/imgdiff.rs"
required-features = ["native"]

[dependencies]
# Core graphics
wgpu = "29.0.4"  # Requires egui-wgpu 0.34+
winit = "0.30.13"

# Math
glam = "0.32.1"

# UI
egui = { version = "0.35.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = "0.35.0"
egui-winit = { version = "0.35.0", default-features = false, features = ["links"] }

# Utilities
bytemuck = { version = "1.25.0", features = ["derive"] }
log = "0.4.33"
rand = "0.10.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.150"
base64 = "0.22.1"
web-time = "1.1.0"  # Cross-platform time for native and WASM

# Native-only dependencies (optional, enabled by "native" feature)
pollster = { version = "0.4.0", optional = true }
directories = { version = "6.0.0", optional = true }
rfd = { version = "0.17.2", optional = true }
open = { version = "5.3.6", optional = true }
crossbeam-channel = { version = "0.5.16", optional = true }
chrono = { version = "0.4.45", optional = true }
env_logger = { version = "0.11.11", optional = true }

# Web-only dependencies (optional, enabled by "web" feature)
wasm-bindgen = { version = "0.2.126", optional = true }
wasm-bindgen-futures = { version = "0.4.76", optional = true }
js-sys = { version = "0.3.103", optional = true }
console_log = { version = "1.0.0", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
gloo-timers = { version = "0.4.0", optional = true, features = ["futures"] }
getrandom = { version = "0.4.3", optional = true, features = ["wasm_js"] }

[dependencies.web-sys]
version = "0.3.103"
optional = true
features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Storage",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "File",
    "FileList",
    "FileReader",
    "console",
    # WebCodecs API for video encoding
    "VideoEncoder",
    "VideoEncoderInit",
    "VideoEncoderConfig",
    "VideoEncoderEncodeOptions",
    "VideoFrame",
    "VideoFrameInit",
    "VideoFrameBufferInit",
    "VideoPixelFormat",
    "EncodedVideoChunk",
    "EncodedVideoChunkType",
    "EncodedVideoChunkMetadata",
    "CodecState",
    "VideoColorSpace",
    "VideoColorSpaceInit",
    "Performance",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
